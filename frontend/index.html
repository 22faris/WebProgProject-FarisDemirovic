
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise | Expense Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <a href="#dashboard" class="brand" data-page="dashboard">
                <span class="brand-icon">$</span>
                SpendWise
            </a>

            <p class="menu-label">MENU</p>

            <nav class="navigation">
                <a href="#dashboard" class="nav-link active" data-page="dashboard">
                    <span>▦</span> Dashboard
                </a>
                <a href="#transactions" class="nav-link" data-page="transactions">
                    <span>⇄</span> Transactions
                </a>
                <a href="#budgets" class="nav-link" data-page="budgets">
                    <span>◎</span> Budgets
                </a>
                <a href="#reports" class="nav-link" data-page="reports">
                    <span>▥</span> Reports
                </a>
                <a href="#profile" class="nav-link" data-page="profile">
                    <span>♙</span> Profile
                </a>
            </nav>

            <div class="sidebar-bottom">
                <div class="user-avatar">FD</div>
                <div>
                    <strong>Demo User</strong>
                    <small>Personal account</small>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div>
                    <p class="eyebrow">PERSONAL FINANCE</p>
                    <h1 id="page-title">Dashboard</h1>
                </div>
                <div class="topbar-right">
                    <span class="demo-badge">DEMO DATA</span>
                    <button class="profile-button" data-page="profile">FD</button>
                </div>
            </header>

            <div class="content-area">

               <div id="view-container">
                    <!-- JavaScript loads each view here -->
               </div>

                <footer class="footer">
                    SpendWise · Web Programming Project · Demo version
                </footer>
            </div>
        </main>
    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
