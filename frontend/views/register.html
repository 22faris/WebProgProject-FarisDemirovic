<section id="register" class="page-section hidden">
    <div class="section-intro">
        <h2>Create your account</h2>
        <p>Register to start organizing your personal finances.</p>
    </div>

    <article class="panel auth-panel">
        <h3>Register</h3>
        <form id="register-form">
            <div>
                <label for="full-name">Full name</label>
                <input id="full-name" class="form-control" type="text"
                    autocomplete="name" placeholder="Your name" required>
            </div>
            <div>
                <label for="register-email">Email address</label>
                <input id="register-email" class="form-control" type="email"
                    autocomplete="email" placeholder="you@example.com" required>
            </div>
            <div>
                <label for="register-password">Password</label>
                <input id="register-password" class="form-control" type="password"
                    autocomplete="new-password" minlength="8" required>
                <small class="muted-text">Use at least 8 characters.</small>
            </div>
            <div>
                <label for="confirm-password">Confirm password</label>
                <input id="confirm-password" class="form-control" type="password"
                    autocomplete="new-password" minlength="8" required>
            </div>
            <button class="primary-button" type="submit">Create account</button>
        </form>
        <p id="auth-message" class="success-message" role="status" aria-live="polite"></p>
        <p class="auth-switch">Already have an account?
            <a href="#login" data-page="login">Login</a>
        </p>
    </article>
</section>
