<section id="login" class="page-section hidden">
    <div class="section-intro">
        <h2>Welcome back</h2>
        <p>Sign in to continue to your SpendWise account.</p>
    </div>

    <article class="panel auth-panel">
        <h3>Login</h3>
        <form id="login-form">
            <div>
                <label for="login-email">Email address</label>
                <input id="login-email" class="form-control" type="email"
                    autocomplete="email" placeholder="you@example.com" required>
            </div>
            <div>
                <label for="login-password">Password</label>
                <input id="login-password" class="form-control" type="password"
                    autocomplete="current-password" minlength="8" required>
            </div>
            <button class="primary-button" type="submit">Login</button>
        </form>
        <p id="auth-message" class="success-message" role="status" aria-live="polite"></p>
        <p class="auth-switch">New to SpendWise?
            <a href="#register" data-page="register">Create an account</a>
        </p>
    </article>
</section>
