
                <!-- PROFILE AND SETTINGS -->
                <section id="profile" class="page-section hidden">
                    <div class="section-intro">
                        <h2>Profile & settings</h2>
                        <p>Manage your personal preferences.</p>
                    </div>
                    <article class="panel profile-panel">
                        <div class="large-avatar">FD</div>
                        <h3>Demo User</h3>
                        <p class="muted-text">demo@example.com</p>
                        <hr>
                        <label for="display-name">Display name</label>
                        <input id="display-name" class="form-control"
                            value="Demo User">
                        <label for="preferred-currency" class="mt-3">Preferred currency</label>
                        <select id="preferred-currency" class="form-select">
                            <option value="BAM">BAM — Bosnia and Herzegovina convertible mark (KM)</option>
                            <option value="EUR">EUR — Euro</option>
                            <option value="USD">USD — US dollar</option>
                        </select>
                        <button id="save-profile" class="primary-button mt-3">
                            Save preferences
                        </button>
                        <p id="profile-message" class="success-message" role="status"></p>
                    </article>

                    <article class="panel api-panel">
                        <h3>Currency converter</h3>
                        <p class="muted-text">
                            Planned feature: convert currencies using an external
                            exchange-rate API.
                        </p>
                        <span class="period-label">API integration planned</span>
                    </article>
                </section>
